
name: Build Flybear Task Project 2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Project 2 ZIP
        run: |
          test -f FlybearTaskAndroidProject-v2.zip

      - name: Extract Project 2
        run: |
          mkdir extracted
          unzip -o FlybearTaskAndroidProject-v2.zip -d extracted
          test -f extracted/settings.gradle
          test -f extracted/app/build.gradle
          test -f extracted/app/src/main/AndroidManifest.xml

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        working-directory: extracted
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlybearTask-Project2-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
