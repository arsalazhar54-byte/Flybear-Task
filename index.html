<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<title>Flybear Task</title>
<style>
:root{--bg:#E6E9EC;--surface:#fff;--ink:#1D2733;--muted:#5E6B78;--line:#CBD2D9;--yellow:#F2B705;--done:#3E7D4F;--high:#C0392B;--med:#D98E04;--low:#2F5D8A;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#12181F;--surface:#1D2630;--ink:#EEF1F4;--muted:#9AA7B4;--line:#33414F;--done:#6FBF86;--high:#EF6B5C;--med:#F0B13A;--low:#7FB0DE}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:12px 14px 100px}header{display:flex;align-items:center;gap:12px}h1,h2,.num,.tab,.addrow button,.btn,.fab{font-family:"Arial Narrow",system-ui,sans-serif}h1{margin:0;font-size:30px;font-weight:800;flex:1}.bear{width:46px;height:46px;display:grid;place-items:center;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;font-size:29px}
.datebar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}.datebar button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px}.datebar .d{min-width:130px;text-align:center;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px -14px 6px;padding:2px 14px 6px;scrollbar-width:none}.tab{flex:none;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:16px}.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.banner{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--high);color:#fff;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between}.banner button{border:0;border-radius:8px;padding:9px 12px;background:#fff;color:#1D2733;font-weight:800}
.board{margin-top:8px;background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 16px;border-left:10px solid var(--yellow)}.board .num{font-size:40px;font-weight:800;line-height:1}.sub{font-size:14px;opacity:.85;margin-top:3px}.bar{height:8px;background:#89939d66;border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .3s}
h2{font-size:19px;margin:16px 0 6px;font-weight:800;color:var(--muted)}.addrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.addrow button{padding:10px 13px;border-radius:8px;border:0;background:var(--yellow);color:var(--ink);font-weight:800;font-size:16px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}li.t{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:10px;padding:12px;border-left:6px solid var(--low)}li.t.high{border-left-color:var(--high)}li.t.med{border-left-color:var(--med)}li.t.k{border-left-color:var(--yellow)}.chk{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);background:none;color:#fff;font-size:18px;padding:0}li.done .chk{background:var(--done);border-color:var(--done)}.body{flex:1;min-width:0}.title{font-weight:700;overflow-wrap:anywhere}li.done .title{text-decoration:line-through;color:var(--muted)}.meta{font-size:13px;color:var(--muted);margin-top:3px}.del{flex:none;background:none;border:0;color:var(--muted);font-size:22px;padding:0 6px}.empty{background:var(--surface);border:2px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border-radius:10px;padding:12px;margin-bottom:8px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}.ok{color:var(--done)}.bad{color:var(--high)}.btn{padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:16px}.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px}.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.prow:last-child{border:0}.prow span{flex:1;font-weight:700}.prow input[type=time]{width:120px;padding:8px}.prow input[type=checkbox]{width:26px;height:26px}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}td{padding:11px 12px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:800}tr.h td{background:var(--ink);color:var(--bg);font-weight:800}
dialog{border:0;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:auto auto 0;background:var(--surface);color:var(--ink)}dialog::backdrop{background:#0a0f1490}label{display:block;font-size:14px;font-weight:700;margin:12px 0 4px}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px system-ui}.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1}.calc{margin-top:10px;font-weight:800;color:var(--low)}.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--yellow);color:var(--ink);font-weight:900;font-size:20px;box-shadow:0 4px 14px #0004}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--low);outline-offset:2px}
</style>
</head>
<body><div class="app">
<header><div class="bear">🐻</div><h1>Flybear Task</h1></header>
<div class="datebar"><button id="prev" aria-label="Previous day">‹</button><div class="d" id="dlabel"></div><button id="next" aria-label="Next day">›</button></div>
<div id="banner"></div><div class="tabs" id="tabs" role="tablist"></div><div id="main"></div></div>
<button class="fab" id="fab">＋ Add task</button>
<dialog id="dlg"><form method="dialog" id="form"><div id="fields"></div><div class="calc" id="calc"></div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn pri">Save</button></div></form></dialog>
<script>
const KEY="flybear.v1",PR=["Fajr","Dhuhr","Asr","Maghrib","Isha"];
const T={
 task:{l:"Task",f:[["title","Task","text"],["prio","Priority","sel",["high","med","low"]],["time","Time (optional)","time"]]},
 inbound:{l:"Inbound",f:[["ref","Supplier / item","text"],["ctn","Cartons (Ctn)","number"],["ppc","Pieces per carton","number"]]},
 sort:{l:"Stock sorting",f:[["ref","Item","text"],["pcs","Pieces sorted","number"]]},
 rack:{l:"Put on rack",f:[["ref","Item","text"],["rack","Rack no.","text"],["pcs","Pieces","number"]]},
 tag:{l:"Tag pieces",f:[["ref","Item","text"],["pcs","Pieces tagged","number"]]},
 assign:{l:"Order assigned",f:[["ord","Order no.","text"],["pcs","Order quantity","number"],["who","Assigned to (optional)","text"]]},
 pick:{l:"Picking",f:[["ord","Order no.","text"],["pcs","Quantity picked","number"]]},
 refill:{l:"Refilling",f:[["ref","Item","text"],["rack","Refill to rack","text"],["pcs","Pieces","number"]]},
 brk:{l:"Break",f:[["from","Break start","time"],["to","Break end","time"]]}
};
const LAB={ctn:"Ctn",ppc:"pcs/ctn",pcs:"pcs",rack:"Rack",who:"To",prio:"",time:""};
const TABS=[["tasks","Tasks"],["stock","Stock"],["orders","Orders"],["shift","Shift"],["close","Closing"],["res","Results"]];
const GRP={stock:["inbound","sort","rack","tag"],orders:["assign","pick","refill"]};
const CL=[["oven","Oven turned off"],["lights","Lights turned off"],["ac","AC turned off"],["fans","Fans turned off"]];
let S={logs:[],pd:{},close:{},cfg:{closing:"22:00",remind:"21:55",pt:{Fajr:"05:00",Dhuhr:"12:30",Asr:"15:45",Maghrib:"18:15",Isha:"19:45"}}};
let tab="tasks",day=iso(new Date()),ftype="task";
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function shift(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x){S=Object.assign(S,x);S.cfg=Object.assign({closing:"22:00",remind:"21:55"},S.cfg);S.cfg.pt=Object.assign({Fajr:"05:00",Dhuhr:"12:30",Asr:"15:45",Maghrib:"18:15",Isha:"19:45"},S.cfg.pt||{})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Storage is full. Remove older closing photos.")}}
const $=id=>document.getElementById(id);
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const num=v=>+v||0,L=(type,d=day)=>S.logs.filter(e=>e.type===type&&e.date===d),sum=(arr,k)=>arr.reduce((a,e)=>a+num(e[k]),0);
function mins(e){if(!e.from||!e.to)return 0;let m=(+e.to.slice(0,2)*60+ +e.to.slice(3))-(+e.from.slice(0,2)*60+ +e.from.slice(3));return m<0?m+1440:m}
function closeDone(d=day){const c=S.close[d];return !!(c&&CL.every(([k])=>c[k]))}
function nowHM(){const n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")}
function render(){const today=iso(new Date());$("dlabel").textContent=day===today?"Today":new Date(day+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});const tb=$("tabs");tb.innerHTML="";TABS.forEach(([k,n])=>{const b=h("button","tab",n);b.setAttribute("role","tab");b.setAttribute("aria-selected",k===tab);b.onclick=()=>{tab=k;render()};tb.appendChild(b)});$("fab").hidden=tab!=="tasks";banner();const m=$("main");m.innerHTML="";({tasks:vTasks,stock:v=>vGroup(v,"stock"),orders:v=>vGroup(v,"orders"),shift:vShift,close:vClose,res:vRes})[tab](m)}
function banner(){const b=$("banner");b.innerHTML="";const t=new Date();if(day===iso(t)&&t.getDay()!==6&&nowHM()>=S.cfg.remind&&!closeDone()){const d=h("div","banner");d.append(h("span",null,"Time to close: turn off AC, fans, lights and oven, then take photos."));const g=h("button",null,"Open");g.onclick=()=>{tab="close";render()};d.append(g);b.append(d)}}
function entry(e){const li=h("li","t"+(e.type==="task"?" "+(e.prio||"med"):" k")+(e.done?" done":""));if(e.type==="task"){const c=h("button","chk",e.done?"✓":"");c.setAttribute("aria-label",e.done?"Mark as not done":"Mark as done");c.onclick=()=>{e.done=!e.done;save();render()};li.append(c)}const body=h("div","body"),main=e.type==="brk"?(e.from+" – "+e.to):(e.title||e.ref||e.ord||"");body.append(h("div","title",main));let meta=[];if(e.type!=="task")meta.push(T[e.type].l);T[e.type].f.forEach(([k])=>{if(["title","ref","ord","from","to"].includes(k)||!e[k])return;meta.push((k==="rack"||k==="who"?LAB[k]+" ":"")+e[k]+(k==="pcs"?" pcs":k==="ctn"?" ctn":k==="ppc"?" pcs/ctn":""))});if(e.type==="inbound")meta.push("= "+e.total+" pcs");if(e.type==="brk")meta.push(mins(e)+" min");body.append(h("div","meta",meta.join(" · ")));li.append(body);const d=h("button","del","×");d.setAttribute("aria-label","Delete");d.onclick=()=>{if(confirm("Delete this entry?")){S.logs=S.logs.filter(x=>x.id!==e.id);save();render()}};li.append(d);return li}
function listOf(m,arr,emptyTxt){if(!arr.length){m.append(h("div","empty",emptyTxt));return}const ul=h("ul");arr.forEach(e=>ul.append(entry(e)));m.append(ul)}
function vTasks(m){const all=L("task"),done=all.filter(t=>t.done).length,bd=h("section","board");bd.append(h("div","num",done+" / "+all.length),h("div","sub",all.length?(done===all.length?"All tasks done. Nice shift.":"tasks done"):"No tasks for this day yet"));const bar=h("div","bar"),i=h("i");i.style.width=all.length?Math.round(done/all.length*100)+"%":"0%";bar.append(i);bd.append(bar);m.append(bd);const c=h("div","card"),tp=h("div","top");tp.append(h("span",null,"Closing checklist"),h("span",closeDone()?"ok":"bad",closeDone()?"Complete ✓":"Not done"));c.append(tp);m.append(c);const r={high:0,med:1,low:2},s=all.slice().sort((a,b)=>(!!a.done-!!b.done)||(r[a.prio]-r[b.prio])||((a.time||"99")>(b.time||"99")?1:-1));m.append(h("h2",null,"Today’s list"));listOf(m,s,"Nothing planned. Tap “Add task” to start your list.");const prev=S.logs.filter(t=>t.type==="task"&&t.date===shift(day,-1)&&!t.done);if(prev.length){const b=h("button","btn",`Carry over ${prev.length} unfinished task${prev.length>1?"s":""} from the day before`);b.style.cssText="width:100%;margin-top:10px";b.onclick=()=>{prev.forEach(t=>t.date=day);save();render()};m.append(b)}}
function vGroup(m,g){const row=h("div","addrow");GRP[g].forEach(k=>{const b=h("button",null,"＋ "+T[k].l);b.onclick=()=>openForm(k);row.append(b)});m.append(row);GRP[g].forEach(k=>{const a=L(k);m.append(h("h2",null,T[k].l+" ("+a.length+")"));if(k==="inbound"&&a.length)m.append(h("div","meta","Total: "+sum(a,"ctn")+" ctn = "+sum(a,"total")+" pcs"));listOf(m,a,"No "+T[k].l.toLowerCase()+" entries yet.")})}
function vShift(m){const row=h("div","addrow"),b=h("button",null,"＋ Add break");b.onclick=()=>openForm("brk");row.append(b);m.append(row);const br=L("brk");m.append(h("h2",null,"Break hours — "+br.reduce((a,e)=>a+mins(e),0)+" min"));listOf(m,br,"No breaks logged.");m.append(h("h2",null,"Prayer times"));const c=h("div","card");S.pd[day]=S.pd[day]||{};PR.forEach(p=>{const r=h("div","prow"),cb=h("input");cb.type="checkbox";cb.checked=!!S.pd[day][p];cb.setAttribute("aria-label",p+" prayed");cb.onchange=()=>{S.pd[day][p]=cb.checked;save()};const t=h("input");t.type="time";t.value=S.cfg.pt[p];t.setAttribute("aria-label",p+" time");t.onchange=()=>{S.cfg.pt[p]=t.value;save()};r.append(cb,h("span",null,p),t);c.append(r)});c.append(h("div","meta","Set the times for your city. Tick when prayed."));m.append(c);m.append(h("h2",null,"Closing settings"));const k=h("div","card");[["Closing time","closing"],["Reminder (Sun–Fri)","remind"]].forEach(([label,key])=>{const r=h("div","prow"),t=h("input");t.type="time";t.value=S.cfg[key];t.onchange=()=>{S.cfg[key]=t.value;save()};r.append(h("span",null,label),t);k.append(r)});k.append(h("div","meta","Reminder banner appears while the app is open. Use your phone alarm for a reminder when the app is closed."));m.append(k)}
function vClose(m){const c=S.close[day]=S.close[day]||{},bd=h("section","board"),n=CL.filter(([k])=>c[k]).length;bd.append(h("div","num",n+" / 4"),h("div","sub",closeDone()?"Closing complete at "+c.at:"Take a photo of each item once it is off"));const bar=h("div","bar"),i=h("i");i.style.width=n*25+"%";bar.append(i);bd.append(bar);m.append(bd);m.append(h("div","meta","Closing time "+S.cfg.closing+". No reminder on Saturday."));CL.forEach(([k,name])=>{const cd=h("div","card"),tp=h("div","top");tp.append(h("span",null,name),h("span",c[k]?"ok":"bad",c[k]?"✓ Photo saved":"Photo needed"));cd.append(tp);if(c[k]){const im=h("img","thumb");im.src=c[k];im.alt=name+" photo";cd.append(im)}const lb=h("label","btn pri",c[k]?"Retake photo":"Take photo");lb.style.cssText="display:block;text-align:center;margin-top:10px";const f=h("input");f.type="file";f.accept="image/*";f.setAttribute("capture","environment");f.hidden=true;f.onchange=()=>{if(f.files[0])shrink(f.files[0],u=>{c[k]=u;if(closeDone()&&!c.at)c.at=nowHM();prune();save();render()})};lb.append(f);cd.append(lb);m.append(cd)})}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.55))};im.src=r.result};r.readAsDataURL(file)}
function prune(){Object.keys(S.close).sort().slice(0,-7).forEach(d=>delete S.close[d])}
function metrics(){const inb=L("inbound"),as=L("assign"),pk=L("pick"),pd=S.pd[day]||{},tk=L("task");return [["Tasks","h"],["Tasks done",tk.filter(t=>t.done).length+" / "+tk.length],["Stock","h"],["Inbound cartons",sum(inb,"ctn")],["Inbound pieces",sum(inb,"total")],["Pieces sorted",sum(L("sort"),"pcs")],["Pieces put on racks",sum(L("rack"),"pcs")],["Pieces tagged",sum(L("tag"),"pcs")],["Orders","h"],["Orders assigned",as.length],["Assigned quantity",sum(as,"pcs")],["Orders picked",new Set(pk.map(e=>e.ord)).size],["Picked quantity",sum(pk,"pcs")],["Refilled pieces",sum(L("refill"),"pcs")],["Shift","h"],["Break minutes",L("brk").reduce((a,e)=>a+mins(e),0)],["Prayers done",PR.filter(p=>pd[p]).length+" / 5"],["Closing",closeDone()?"Complete "+(S.close[day].at||""):"Not complete"]]}
function vRes(m){m.append(h("h2",null,"Results sheet — "+$("dlabel").textContent));const t=h("table");metrics().forEach(([a,b])=>{const tr=h("tr",b==="h"?"h":null);tr.append(h("td",null,a));if(b==="h")tr.firstChild.colSpan=2;else tr.append(h("td",null,String(b)));t.append(tr)});m.append(t);const b=h("button","btn pri","Copy results as text");b.style.cssText="width:100%;margin-top:12px";b.onclick=()=>{const txt="Flybear Task — "+day+"\n"+metrics().map(([a,v])=>v==="h"?"\n"+a.toUpperCase():a+": "+v).join("\n");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>b.textContent="Copied ✓").catch(()=>window.prompt("Copy this text:",txt));else window.prompt("Copy this text:",txt)};m.append(b)}
function openForm(type){ftype=type;const f=$("fields");f.innerHTML="";$("calc").textContent="";f.append(h("h2",null,"Add "+T[type].l.toLowerCase()));f.lastChild.style.cssText="margin:0;color:inherit";T[type].f.forEach(([k,lab,kind,opts])=>{const l=h("label",null,lab),inp=kind==="sel"?h("select"):h("input");if(kind==="sel"){opts.forEach(o=>{const op=h("option",null,o[0].toUpperCase()+o.slice(1));op.value=o;inp.append(op)})}else{inp.type=kind;if(kind==="number"){inp.min="0";inp.step="1"}if(k==="prio")inp.value="med"}inp.id="field_"+k;inp.name=k;f.append(l,inp);if(k==="ctn"||k==="ppc")inp.oninput=calcInbound});$("dlg").showModal()}
function calcInbound(){const c=num($("field_ctn")?.value),p=num($("field_ppc")?.value);$("calc").textContent=c&&p?"Total: "+(c*p)+" pieces":""}
$("form").addEventListener("submit",e=>{e.preventDefault();const type=ftype,obj={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type,date:day};T[type].f.forEach(([k,,kind])=>{const el=$("field_"+k);if(!el)return;obj[k]=kind==="number"?num(el.value):el.value.trim()});if(type==="inbound")obj.total=num(obj.ctn)*num(obj.ppc);if(type==="task"&&!obj.title){alert("Please enter a task.");return}if(type==="brk"&&obj.from&&obj.to)obj.duration=mins(obj);S.logs.push(obj);save();$("dlg").close();render()});
$("cancel").onclick=()=>$("dlg").close();$("fab").onclick=()=>openForm("task");$("prev").onclick=()=>{day=shift(day,-1);render()};$("next").onclick=()=>{day=shift(day,1);render()};
load();render();
</script></body></html>
